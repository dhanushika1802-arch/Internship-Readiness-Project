services:
  # ── Backend: Flask API ─────────────────────────────────────────
  - type: web
    name: readyup-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # ── Frontend: React/Vite Static Site ──────────────────────────
  - type: web
    name: readyup-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false   # You will paste the backend URL here in the Render dashboard
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
